<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Allow root to own the KAuth helper service -->
  <policy user="root">
    <allow own="org.miryugaming.grubconfig"/>
  </policy>

  <!-- Allow any user to send messages to the helper; polkit handles
       the actual authorization (auth_admin) before the action runs. -->
  <policy context="default">
    <allow send_destination="org.miryugaming.grubconfig"/>
  </policy>

</busconfig>
